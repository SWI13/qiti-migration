<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Qiti Admin</title>

<!-- الثيم يتحطّ قبل ما يتحمّل CSS باش ما يبانش وميض أبيض في الوضع
     الليلي. نفس المفتاح (qiti-theme) تاع المتجر — التاجر يبدّل مرّة
     وحدة والزوج يتبعو. بلا اختيار مخزّن نتبعو نظام التشغيل. -->
<script>
(function () {
  try {
    var stored = localStorage.getItem('qiti-theme');
    document.documentElement.dataset.theme =
      stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch (e) {
    document.documentElement.dataset.theme = 'light';
  }
})();
</script>

<!-- الترتيب مقصود: styles.css (tokens تاع المتجر) → tokens.css (tokens
     اللوحة، تبني فوقهم) → base (الهيكل) → components (العناصر) →
     pages (الخاص بصفحة). أي ملف يقرا من اللي قبلو برك. -->
<link rel="stylesheet" href="/assets/css/styles.css">
<link rel="stylesheet" href="/admin/css/tokens.css">
<link rel="stylesheet" href="/admin/css/base.css">
<link rel="stylesheet" href="/admin/css/components.css">
<link rel="stylesheet" href="/admin/css/pages.css">
<!-- الخاص بمحرّر واحد برك — منفصل باش pages.css ما يكبرش بلا حدّ -->
<link rel="stylesheet" href="/admin/css/page-products.css">
<link rel="stylesheet" href="/admin/css/page-campaigns.css">
<link rel="stylesheet" href="/admin/css/page-lists.css">
</head>
<body>

<!-- الجذر اللي app.js يبني فيه كامل الواجهة — صفحة وحدة، راوتينغ بالـ hash -->
<div id="adminRoot" class="admin"></div>

<script type="module" src="/admin/js/app.js"></script>
</body>
</html>
