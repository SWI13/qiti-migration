<!DOCTYPE html>
<html lang="ar-DZ" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجّل طلبك — Qiti</title>
<meta name="description" content="طلبك من Qiti تسجّل. نتصلو بيك باش نأكّدو، وما تخلّص والو حتى يوصلك.">
<meta name="theme-color" content="#FF6B2C">
<meta name="color-scheme" content="light dark">

<!--
  صفحة نجاح الطلب — رابط مستقل بذاته (/checkout-success).

  علاش رابط ماشي بلوك مخبّي في الصفحة الرئيسية: تيك توك (وأي منصّة
  إعلانات) تقدر تعرّف تحويل بقاعدة "الرابط يحتوي /checkout-success".
  بلوك يبان بـ JavaScript في نفس الرابط ما يعطي حتى إشارة برّانية.

  ⚠️ الصفحة ما تتفهرسش (robots: noindex): ما عندها معنى بلا طلب،
  وفهرستها تخلّي غوغل يقدّمها كنتيجة بحث فارغة.
-->
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<svg width="0" height="0" aria-hidden="true" style="position:absolute">
<defs>
  <g id="i-pin"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></g>
  <g id="i-check"><path d="M20 6 9 17l-5-5"/></g>
  <g id="i-cash"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></g>
  <g id="i-call"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/></g>
  <g id="i-truck"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M14 9h4l4 4v4a1 1 0 0 1-1 1h-1"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></g>
  <g id="i-shield"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
</defs>
</svg>

<header class="topbar">
  <div class="wrap topbar__in">
    <a class="brand" href="/">
      <span class="brand__mark"><svg class="ico" viewBox="0 0 24 24"><use href="#i-pin"/></svg></span>
      Qiti
    </a>
    <span class="topbar__cod">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-cash"/></svg>
      تخلّص كي يوصلك
    </span>
  </div>
</header>

<main class="wrap" id="main">

  <section class="card">
    <div class="done">
      <span class="done__ico"><svg class="ico" viewBox="0 0 24 24"><use href="#i-check"/></svg></span>
      <h1>تسجّل الطلب!</h1>
      <span class="done__id" id="orderId" hidden></span>
      <p id="doneMsg">شكراً! طلبك من Qiti تسجّل. نتصلو بيك باش نأكّدو، وما تخلّص والو حتى يوصلك.</p>
      <div class="done__next">
        <a class="btn btn--primary" href="https://wa.me/213555000000" rel="noopener">راسلنا في واتساب</a>
        <a class="btn btn--ghost" href="/">ارجع للرئيسية</a>
      </div>
    </div>
  </section>

  <section class="trust">
    <div class="trust__it">
      <svg class="ico ico--lg" viewBox="0 0 24 24"><use href="#i-call"/></svg>
      <b>نتصلو بيك</b>
      <small>نأكّدو الطلب قبل ما نبعثو</small>
    </div>
    <div class="trust__it">
      <svg class="ico ico--lg" viewBox="0 0 24 24"><use href="#i-truck"/></svg>
      <b>من 2 لـ 5 أيام</b>
      <small>حسب الولاية</small>
    </div>
    <div class="trust__it">
      <svg class="ico ico--lg" viewBox="0 0 24 24"><use href="#i-cash"/></svg>
      <b>تخلّص كي توصل</b>
      <small>ما تخلّص والو قبل</small>
    </div>
  </section>

  <footer class="foot">
    <div class="foot__links">
      <a href="tel:+213555000000">📞 0555 00 00 00</a>
      <a href="https://wa.me/213555000000" rel="noopener">واتساب</a>
    </div>
    <p>© Qiti — التوصيل لـ 58 ولاية</p>
  </footer>
</main>

<script>
/*
 * رقم الطلب يجي في ?order= — نعرضوه برك، ما نجيبو والو من الخادم:
 * الرقم وحدو ما يفتح حتى معلومة، والصفحة تبقى ستاتيك وسريعة.
 *
 * التنظيف مقصود: أي نص برّاني في الرابط يتلصق في الصفحة هو ثغرة
 * حقن. نقبلو غير الحروف والأرقام والشرطات، وناخذو 40 حرف الأولى.
 */
(function () {
  'use strict';
  var raw = new URLSearchParams(window.location.search).get('order') || '';
  var id = raw.replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40);
  if (!id) return;
  var box = document.getElementById('orderId');
  box.textContent = 'رقم الطلب: ' + id;
  box.hidden = false;
})();
</script>
</body>
</html>
