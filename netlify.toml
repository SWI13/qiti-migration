# ⚠️ publish كان "." — كان ينشر جذر المستودع كامل، بما فيه
# /netlify/lib/*.mjs و/package.json. دروك سكريبت البناء ينسخ غير
# الملفات العامّة لـ dist/. شوف scripts/build.mjs.
[build]
  publish    = "dist"
  functions  = "netlify/functions"
  command    = "npm run build"

[functions]
  node_bundler = "esbuild"

# محلياً نخدمو من الجذر مباشرة — التعديل في admin/js/*.js يبان بـ refresh
# برك، بلا ما تعاود npm run build في كل مرّة. تسريب المصدر ما عندو معنى
# على localhost؛ اللي يهمّ هو [build] فوق، وهو اللي يتنشر.
#
# ⚠️ بلا [dev].command، netlify dev يستعمل سيرفرو الستاتيك المبني فيه
# ("simple static server" — يبان في اللوق "No app server detected").
# جرّبناه: مكسور — يخدم index.html في الجذر برك، وأي ملف في مجلّد
# فرعي (admin/admin.js، assets/js/main.js…) يرجع 403 بلا حتى تسجيل.
# الحل: سيرفر بسيط كتبناه بروحنا (scripts/dev-server.mjs، بلا
# dependency)، ونخلّيو netlify dev يبروكسي فوقو للملفات، وهو يدير
# الـ redirects والفنكشنات كيما في الإنتاج.
[dev]
  command    = "node scripts/dev-server.mjs"
  targetPort = 8896
  publish    = "."

# روابط الميديا: /media/:id يوصل لفنكشن الخدمة. زوج قواعد — وحدة على
# القياس الشائع (رابط بجزء واحد) وأخرى splat احتياطية — بلا ما نلمسو
# جذر الموقع (catch-all راهو يتزاد في تغيير آخر).
[[redirects]]
  from = "/media/:id"
  to = "/.netlify/functions/media-serve/:id"
  status = 200

[[redirects]]
  from = "/media/*"
  to = "/.netlify/functions/media-serve/:splat"
  status = 200

# صفحات المتجر: الفئات، المنتجات، والحملات في جذر الموقع.
#
# ⚠️ الترتيب مهم. Netlify يشوف الملفات الستاتيك الأول (index.html،
# /assets/…)، ومن بعد القواعد بالترتيب المكتوب. الـ catch-all لازم
# يبقى في الأخير وإلا يبلع كلش.
#
# الحملات تسكن في الجذر (qiti.com/toji-outfit) على خاطر هذا هو الرابط
# اللي يتكتب في الإعلان. الفنكشن يرجع 404 حقيقية للروابط اللي ما
# كايناش — ماشي 200 بصفحة "ما لقيناش"، وإلا غوغل يفهرس الأخطاء المطبعية.

# اللوحة الإدارية — صفحة واحدة ستاتيك، الراوتينغ بالـ hash في المتصفّح
#
# ⚠️ زوج قواعد لازم. "/admin/*" ما يمسكش "/admin" بلا شرطة في الأخير —
# هاذيك تطيح للـ catch-all في الأخير وتوصل لفنكشن render، اللي يرجّع
# 404 حقيقية. والرابط اللي يكتبو المستخدم بيدو هو "/admin" بالضبط.
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/c/*"
  to = "/.netlify/functions/render"
  status = 200

[[redirects]]
  from = "/p/*"
  to = "/.netlify/functions/render"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/render"
  status = 200
